name: ci

on:
    push:
        branches:
            - main
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        runs-on: ubuntu-26.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Install Stylua
              run: cargo install stylua --version 2.5.2 --locked
            - name: Run lint checks
              run: scripts/ci/lint.sh
            - name: Validate workflow syntax
              run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

    test:
        name: test (${{ matrix.neovim }})
        runs-on: ubuntu-26.04
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                neovim: ['v0.11.5', 'stable', 'nightly']
        env:
            MINISTRY_NVIM_PATH: ${{ github.workspace }}/.dependencies/ministry.nvim
            TERMINALIA_NVIM_PATH: ${{ github.workspace }}/.dependencies/terminalia.nvim
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  repository: griwes/ministry.nvim
                  ref: main
                  path: .dependencies/ministry.nvim
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  repository: griwes/terminalia.nvim
                  ref: main
                  path: .dependencies/terminalia.nvim
            - name: Install Neovim
              run: scripts/ci/install-neovim.sh '${{ matrix.neovim }}'
            - name: Run tests
              run: scripts/ci/test.sh
            - name: Run clean-install smoke
              run: scripts/ci/install-smoke.sh
